<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knob - Connecting...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#111;color:#fff;display:flex;justify-content:center;align-items:center;
min-height:100vh;text-align:center;padding:20px}
.wrap{max-width:360px}
h1{font-size:1.3em;margin-bottom:12px}
p{color:#b3b3b3;font-size:.95em;margin-top:8px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid #333;
border-top-color:#1DB954;border-radius:50%;animation:spin .6s linear infinite;
margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#e74c3c}
</style>
</head>
<body>
<div class="wrap">
<div class="spinner"></div>
<h1>Connecting your knob...</h1>
<p id="status">Redirecting to your device...</p>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var code = p.get('code');
  var state = p.get('state');
  var error = p.get('error');

  if (error) {
    document.getElementById('status').innerHTML =
      '<span class="error">Spotify error: ' + error + '</span>';
    document.querySelector('.spinner').style.display = 'none';
    return;
  }

  if (!code || !state) {
    document.getElementById('status').innerHTML =
      '<span class="error">Missing auth code or device address.</span>';
    document.querySelector('.spinner').style.display = 'none';
    return;
  }

  // state = device IP — redirect back to the device with the auth code
  var deviceUrl = 'http://' + state + ':8888/callback?code=' + encodeURIComponent(code);
  document.getElementById('status').textContent = 'Sending to ' + state + '...';

  // Small delay so the user sees the page
  setTimeout(function(){ location.href = deviceUrl; }, 500);
})();
</script>
</body>
</html>
