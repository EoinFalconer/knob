name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The radio isn't built here: its fonts and ringtone are Apple's, kept out
  # of git and made on a Mac (scripts/gen_assets.sh). Its host tests don't
  # need them.
  radio-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host tests radio
        run: apps/radio/test/run.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    strategy:
      matrix:
        app: [kaffi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host tests ${{ matrix.app }}
        shell: bash
        run: |
          if [ -x apps/${{ matrix.app }}/test/run.sh ]; then
            apps/${{ matrix.app }}/test/run.sh
          fi

      - name: Build ${{ matrix.app }}
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
        env:
          IDF_TARGET: esp32s3

      - name: Report binary size
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          . $IDF_PATH/export.sh
          echo "## ${{ matrix.app }} — Binary Size" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          idf.py size 2>/dev/null | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
